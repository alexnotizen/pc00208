<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI 8 – NGỮ PHÁP - Flashcard</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft YaHei",sans-serif;
  background:#fdfbf7;
  display:flex; justify-content:center; color:#202124;
}
.app{width:min(860px,96vw); padding:30px 0 40px}
h1{text-align:center;margin:0 0 15px;font-size:38.4px; font-weight: bold;}
.progress{text-align:center;font-size:21.6px;color:#444;margin-bottom:20px; font-weight: bold;}
.card-wrap{perspective:1200px; cursor:pointer}
.card{
  width:100%; height:592px; position:relative; transform-style:preserve-3d;
  transition:transform .55s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; background:white; box-shadow:0 15px 45px rgba(0,0,0,.15);
  display:flex; flex-direction:column; padding:36px; border:3px solid #eee; overflow-y:auto;
}
.front{justify-content:flex-start; align-items:flex-start; text-align:left}
.back{transform:rotateY(180deg); text-align:left; align-items:flex-start; justify-content:flex-start; padding-top:40px;}

.hl{color: #7c2d12; font-weight: bold; background-color: #fef08a; padding: 2px 6px; border-radius: 4px; border: 1px solid #eab308;}
.hl-blue { color: #ffffff; font-weight: bold; background-color: #2563eb; padding: 2px 6px; border-radius: 4px; }
.hl-red { color: #dc2626; font-weight: bold; }

/* Pinyin mặt trước: căn giữa */
.pinyin{
  font-size:1.68em;
  color:#666666;
  margin-bottom:10px;
  font-weight:bold;
  text-align:center;
  width:100%;
}

.zh-front { font-size: 2.16em; font-weight: bold; margin-bottom: 6px; line-height: 1.3; color: #dc2626; text-align: center; width: 100%; }

/* Mặt sau */
.zh-back { color: #2563eb; font-weight: bold; font-size: 1.74em; line-height: 1.2; display: inline-block; margin-top: 8px; margin-bottom: 2px; }
.pinyin-back { color: #666666; font-weight: bold; font-size: 1.2em; display: block; margin: 2px 0; }
.vi-back { font-size: 1.2em; color: #333; display: block; margin-bottom: 10px; }

.desc-front { font-size: 1.38em; color: #333; margin: 8px 0; text-align: left; width: 100%; line-height: 1.4; }
.desc{font-size: 1.38em; color: #333; margin: 0; text-align: left; width: 100%; line-height: 1.4;}

.controls{display:flex;gap:20px;justify-content:center;margin-top:30px}
button{
  border:0;border-radius:20px;padding:20px 35px;font-size:26.4px;
  cursor:pointer;background:#e9eef7;color:#233044; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,.1);
}
button.primary{background:#2563eb;color:white}
</style>
</head>

<body>
<div class="app">
  <h1 id="title">BÀI 8 – NGỮ PHÁP</h1>
  <div class="progress" id="progress"></div>

  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front" id="frontFace"></div>
      <div class="face back" id="backFace"></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="event.stopPropagation();prevCard()">← TRƯỚC</button>
    <button class="primary" onclick="event.stopPropagation();flipCard()">LẬT THẺ</button>
    <button onclick="event.stopPropagation();nextCard()">TIẾP →</button>
  </div>
</div>

       "<span class='zh-back'>跟大商场比，有的东西在网上买便宜多了。</span><br><span class='pinyin-back'>Gēn dà shāngchǎng bǐ, yǒu de dōngxi zài wǎngshàng mǎi piányi duō le.</span><span class='vi-back'>(So với trung tâm thương mại lớn, có đồ mua trên mạng rẻ hơn nhiều.)</span>" +
       "<span class='zh-back'>那家超市里的东西新鲜多了。</span><br><span class='pinyin-back'>Nà jiā chāoshì lǐ de dōngxi xīnxiān duō le.</span><span class='vi-back'>(Đồ trong siêu thị đó tươi ngon hơn nhiều.)</span>" +
       "<span class='zh-back'>A: 怎么样了？<br>B: 好多了。</span><br><span class='pinyin-back'>A: Zěnmeyang le? <br>B: Hǎo duō le.</span><span class='vi-back'>(A: Thế nào rồi? <br>B: Đỡ hơn nhiều rồi.)</span>" +
       "</div>"
  },
  {
    f: "<div class='zh-front'>LẤY… MÀ NÓI</div>" +
       "<div class='zh-front'><span style='background-color: #2563eb; color: #ffffff; padding: 2px 6px; border-radius: 4px;'>拿</span>…<span style='background-color: #2563eb; color: #ffffff; padding: 2px 6px; border-radius: 4px;'>来说</span></div>" +
       "<div class='pinyin'>ná ... lái shuō</div>" +
       "<div class='desc-front'>" +
       "Dùng để lấy ví dụ, chứng minh điều mình nói là đúng, là thật. Giữa 拿 và 来说 có thể đặt danh từ, cụm danh từ hoặc cụm động từ." +
       "</div>",
    b: "<div class='desc' style='line-height:1.5;'>" +
       "<span class='zh-back'>就拿吃饭来说吧，有高档的大酒店，也有低档的小饭馆儿。</span><br><span class='pinyin-back'>Jiù ná chīfàn lái shuō ba, yǒu gāodàng de dà jiǔdiàn, yě yǒu dīdàng de xiǎo fànguǎnr.</span><span class='vi-back'>(Cứ lấy việc ăn cơm mà nói, có khách sạn lớn cao cấp, cũng có quán ăn nhỏ bình dân.)</span>" +
       "<span class='zh-back'>我们班每个人都有自己的爱好，拿李钟文来说吧，他是个电脑迷。</span><br><span class='pinyin-back'>Wǒmen bān měi gè rén dōu yǒu zìjǐ de àihào, ná Lǐ Zhōngwén lái shuō ba, tā shì gè diànnǎomí.</span><span class='vi-back'>(Mỗi người trong lớp chúng tôi đều có sở thích riêng, lấy Lý Chung Văn mà nói, anh ấy là một người mê máy tính.)</span>" +
       "<span class='zh-back'>不同地方的人有不同的口味，拿陕西人来说，就喜欢吃酸辣的。</span><br><span class='pinyin-back'>Bù tóng dìfang de rén yǒu bù tóng de kǒuwèi, ná Shǎnxī rén lái shuō, jiù xǐhuan chī suān là de.</span><span class='vi-back'>(Người ở các nơi khác nhau có khẩu vị khác nhau, lấy người Thiểm Tây mà nói, họ thích ăn chua cay.)</span>" +
       "<span class='zh-back'>现在一家人都听孩子的，拿看电视来说，孩子要看什么大人们就得看什么。</span><br><span class='pinyin-back'>Xiànzài yì jiā rén dōu tīng háizi de, ná kàn diànshì lái shuō, háizi yào kàn shénme dàren men jiù děi kàn shénme.</span><span class='vi-back'>(Bây giờ cả nhà đều nghe theo con cái, lấy việc xem tivi mà nói, con muốn xem gì thì người lớn phải xem cái đó.)</span>" +
       "<span class='zh-back'>我们学校的生活很方便，拿吃饭来说吧，食堂里什么都有。</span><br><span class='pinyin-back'>Wǒmen xuéxiào de shēnghuó hěn fāngbiàn, ná chīfàn lái shuō ba, shítáng lǐ shénme dōu yǒu.</span><span class='vi-back'>(Cuộc sống ở trường chúng tôi rất tiện lợi, lấy việc ăn cơm mà nói, trong căng tin có đủ thứ.)</span>" +
       "</div>"
  }
];

let idx = 0;

function render() {
  document.getElementById('frontFace').innerHTML = cards[idx].f;
  document.getElementById('backFace').innerHTML = cards[idx].b;
  document.getElementById('progress').innerText = `Thẻ ${idx + 1} / ${cards.length}`;
}

function flipCard() {
  document.getElementById('card').classList.toggle('flipped');
}

function nextCard() {
  idx = (idx + 1) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

function prevCard() {
  idx = (idx - 1 + cards.length) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
    nextCard();
    event.preventDefault();
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
    prevCard();
    event.preventDefault();
  } else if (event.key === ' ' || event.key === 'Enter') {
    flipCard();
    event.preventDefault();
  }
});

render();
</script>
</body>
</html>
